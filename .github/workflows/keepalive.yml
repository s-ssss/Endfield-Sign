name: Keepalive

on:
  schedule:
    - cron: '0 0 1,15 * *'   # 每月 1 号和 15 号 UTC 0 点，北京 8 点
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Dummy commit to keep Actions alive
        uses: actions/checkout@v4
      - run: |
          date +"%Y-%m-%d %H:%M:%S" > last_keepalive.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_keepalive.txt
          git commit -m "chore: keepalive $(date +%F)" || echo "nothing to commit"
          git push
