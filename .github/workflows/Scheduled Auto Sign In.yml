name: Scheduled Auto Sign In

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  auto-sign-in:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Existing Releases
        id: check_releases
        run: |
          RELEASE_COUNT=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases | jq length)
          echo "RELEASE_COUNT=$RELEASE_COUNT"
          if [ "$RELEASE_COUNT" -eq 0 ]; then
            echo "NO_RELEASES_FOUND=true" >> $GITHUB_ENV
          else
            echo "NO_RELEASES_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Trigger Build and Release Workflow if no release exist
        if: env.NO_RELEASES_FOUND == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'Build and Release (Linux-x64 Only).yml',
              ref: context.ref,
              inputs: {
                tag_name: 'v1.0.0',
                release_description: 'Automatic build because there is no existing release.',
                retrigger_sign_in: 'true'
              }
            });

      - name: Get latest release asset URL
        id: get_release
        if: env.NO_RELEASES_FOUND != 'true'
        run: |
          ASSET_NAME=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[] | select(.name | test("linux[-_]?x64|linux-amd64"; "i")) | .name' | head -n 1)
          echo "ASSET_NAME=$ASSET_NAME"
          if [ -z "$ASSET_NAME" ] || [ "$ASSET_NAME" = "null" ]; then
            echo "No linux-x64 asset found in latest release"
            exit 1
          fi
          LATEST_RELEASE_URL="https://github.com/${{ github.repository }}/releases/latest/download/${ASSET_NAME}"
          echo "LATEST_RELEASE_URL=$LATEST_RELEASE_URL" >> $GITHUB_ENV

      - name: Download latest release asset
        if: env.NO_RELEASES_FOUND != 'true'
        run: |
          curl -L -f -o sign-in-program "${{ env.LATEST_RELEASE_URL }}"
          ls -lh sign-in-program
          file sign-in-program
          chmod +x ./sign-in-program

      - name: Run sign-in program
        if: env.NO_RELEASES_FOUND != 'true'
        run: |
          ./sign-in-program
